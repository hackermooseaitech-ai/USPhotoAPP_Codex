  <circle cx="269" cy="378" r="6" fill="#38BDF8"/>
  <circle cx="252" cy="441" r="5" fill="#38BDF8"/>

  <!-- Right mechanical wing. -->
  <path d="M460 285C530 214 620 184 714 216C657 244 604 280 562 332C617 310 669 310 729 342C672 365 621 399 578 453C622 446 660 458 699 494C638 502 569 489 506 438L460 285Z" fill="url(#darkMetal)" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M488 291L679 229M499 321L702 343M514 356L662 477M534 396L608 485" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

<div class="grid gap-5 md:grid-cols-[260px_minmax(0,1fr)]">
  <div>
    <a href="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'U' }}" target="_blank" rel="noopener">
      <img
        class="aspect-square w-full rounded-md border border-zinc-200 bg-zinc-100 object-cover shadow-sm"
        src="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'U' }}"
        alt="Watermarked visa photo preview"
        loading="eager"
      >
    </a>
    <a class="mt-2 block text-center text-xs font-medium text-zinc-600 underline" href="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'U' }}" target="_blank" rel="noopener">
      Open preview image
    </a>
  </div>

  <div>
    <h2 class="text-xl font-semibold">Preview ready</h2>
    <p class="mt-2 text-sm leading-6 text-zinc-600">This preview is watermarked. Checkout unlocks the clean 600x600 JPEG and 4x6 print template.</p>

    {% if order.processing_notes %}
      <div class="mt-4 rounded-md border border-zinc-200 bg-zinc-50 p-3 text-xs leading-5 text-zinc-600">
        <div class="mb-1 font-semibold text-zinc-900">Processing log</div>
        {{ order.processing_notes|linebreaksbr }}
      </div>
    {% endif %}

    <form class="mt-5" method="post" action="{% url 'orders:checkout' order.id %}">
      {% csrf_token %}
      <button class="inline-flex w-full items-center justify-center rounded-md bg-emerald-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-emerald-800" type="submit">
        Pay and download
      </button>
    </form>
  </div>
</div>

<div class="mt-5">
  <a class="text-sm font-medium text-zinc-700 underline" href="{% url 'orders:index' %}">Start over</a>
</div>

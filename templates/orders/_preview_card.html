<div class="grid gap-5 md:grid-cols-[300px_minmax(0,1fr)]">
  <div>
    <div class="relative aspect-square w-full overflow-hidden rounded-md border border-zinc-200 bg-zinc-100 shadow-sm">
      <a href="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'YmdHisu' }}" target="_blank" rel="noopener">
        <img
          class="h-full w-full object-cover"
          src="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'YmdHisu' }}"
          alt="Watermarked visa photo preview"
          loading="eager"
        >
      </a>

      <form
        class="absolute right-2 top-2 grid w-14 grid-cols-3 gap-0.5 rounded border border-white/70 bg-zinc-950/60 p-1 shadow-lg backdrop-blur"
        hx-post="{% url 'orders:adjust' order.id %}"
        hx-target="#preview-panel"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <span></span>
        <button class="h-4 rounded bg-white/95 text-[10px] font-semibold leading-none text-zinc-950 transition hover:bg-emerald-100" type="submit" name="action" value="move_up" aria-label="Move head up">↑</button>
        <span></span>
        <button class="h-4 rounded bg-white/95 text-[10px] font-semibold leading-none text-zinc-950 transition hover:bg-emerald-100" type="submit" name="action" value="move_left" aria-label="Move head left">←</button>
        <button class="h-4 rounded bg-white/95 text-[9px] font-semibold leading-none text-zinc-950 transition hover:bg-emerald-100" type="submit" name="action" value="reset" aria-label="Reset crop">•</button>
        <button class="h-4 rounded bg-white/95 text-[10px] font-semibold leading-none text-zinc-950 transition hover:bg-emerald-100" type="submit" name="action" value="move_right" aria-label="Move head right">→</button>
        <span></span>
        <button class="h-4 rounded bg-white/95 text-[10px] font-semibold leading-none text-zinc-950 transition hover:bg-emerald-100" type="submit" name="action" value="move_down" aria-label="Move head down">↓</button>
        <span></span>
      </form>
    </div>

    <form
      id="head-slider-form"
      class="mt-4 rounded-md border border-zinc-200 bg-white p-3"
      hx-post="{% url 'orders:adjust' order.id %}"
      hx-trigger="change"
      hx-target="#preview-panel"
      hx-swap="innerHTML"
    >
      {% csrf_token %}
      <input type="hidden" name="action" value="set_ratio">
      <div class="mb-2 flex items-center justify-between gap-3">
        <span class="text-sm font-semibold text-zinc-950">Head size</span>
        <output id="head-percent-output" class="rounded-md bg-zinc-100 px-2 py-1 text-sm font-semibold text-zinc-950">{{ order.crop_head_percent }}%</output>
      </div>
      <div class="grid grid-cols-[42px_minmax(0,1fr)_42px] items-center gap-2">
        <span class="text-center text-xs font-semibold text-zinc-500">53%</span>
        <input
          class="visa-range h-8 w-full"
          type="range"
          name="head_percent"
          min="53"
          max="62"
          step="1"
          value="{{ order.crop_head_percent }}"
          oninput="document.getElementById('head-percent-output').textContent = `${this.value}%`"
          aria-label="Head size percentage"
        >
        <span class="text-center text-xs font-semibold text-zinc-500">62%</span>
      </div>
      <div class="htmx-indicator mt-2 rounded-md border border-amber-200 bg-amber-50 p-2 text-xs text-amber-900">
        Updating preview...
      </div>
    </form>

    <a class="mt-2 block text-center text-xs font-medium text-zinc-600 underline" href="{% url 'orders:preview' order.id %}?v={{ order.updated_at|date:'YmdHisu' }}" target="_blank" rel="noopener">
      Open preview image
    </a>
  </div>

  <div>
    <h2 class="text-xl font-semibold">Preview ready</h2>
    <p class="mt-2 text-sm leading-6 text-zinc-600">This preview is watermarked. Checkout unlocks the clean 600x600 JPEG and 4x6 print template.</p>

    <form class="mt-5" method="post" action="{% url 'orders:checkout' order.id %}">
      {% csrf_token %}
      <button class="inline-flex w-full items-center justify-center rounded-md bg-emerald-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-emerald-800" type="submit">
        Pay and download
      </button>
    </form>
  </div>
</div>

<div class="mt-5 flex items-center justify-between gap-4">
  <a class="text-sm font-medium text-zinc-700 underline" href="{% url 'orders:edit' order.id %}">Reload</a>
  <button class="text-sm font-medium text-zinc-700 underline" type="button" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '{% url 'orders:index' %}'; }">Return</button>
</div>

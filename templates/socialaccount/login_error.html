{% extends "base.html" %}
{% block content %}
<section class="mx-auto flex min-h-screen max-w-3xl items-center px-5 py-10">
  <div class="w-full rounded-lg border border-zinc-200 bg-white p-6 shadow-sm">
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-emerald-700">Hacker Moose</p>
    <h1 class="mt-3 text-3xl font-semibold">Third-party login failed</h1>
    <p class="mt-3 leading-7 text-zinc-700">
      Yahoo did not complete the OAuth login. Please confirm the Yahoo Developer app has the correct redirect URI and profile/email permissions, then try again.
    </p>
    <a class="mt-6 inline-flex items-center justify-center rounded-md bg-zinc-950 px-4 py-3 text-sm font-semibold text-white" href="{% url 'orders:index' %}">
      Back to homepage
    </a>
  </div>
</section>
{% endblock %}

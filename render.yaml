services:
  - type: web
    name: usphotoapp-codex
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py preload_rembg_model && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn hacker_moose.wsgi:application --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "usphotoapp-codex.onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://usphotoapp-codex.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: STRIPE_PRICE_CENTS
        value: "399"
      - key: SITE_URL
        value: "https://usphotoapp-codex.onrender.com"
      - key: USE_LOCAL_BACKGROUND_REMOVAL
        value: "True"
      - key: USE_REMBG_BACKGROUND_REMOVAL
        value: "True"
      - key: REMBG_MODEL
        value: "u2netp"
      - key: U2NET_HOME
        value: "/opt/render/project/src/.u2net"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
